<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十日南洋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f3efe2; --card:#fbf8ee; --ink:#2c3a33; --muted:#6b776b;
  --jade:#4f8571; --deep:#36604f; --sage:#9dbba7; --mint:#dbe8dc;
  --pink:#d99c94; --pink-l:#f3dfd9; --terra:#c07e62; --ochre:#cfa556; --ochre-l:#f1e5c4;
  --turq:#6fa8a2; --turq-l:#d8ebe8; --rose:#9c5557; --rose-l:#f4e2df;
  --hand:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"Caveat","Comic Sans MS",cursive;
  --tile:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23e5ead9'/><rect x='3' y='3' width='58' height='58' rx='7' fill='none' stroke='%234f8571' stroke-width='1.4'/><g fill='%239dbba7' stroke='%234f8571' stroke-width='.8'><ellipse cx='32' cy='16' rx='6' ry='10'/><ellipse cx='32' cy='48' rx='6' ry='10'/><ellipse cx='16' cy='32' rx='10' ry='6'/><ellipse cx='48' cy='32' rx='10' ry='6'/></g><g fill='%23d99c94'><ellipse cx='32' cy='18' rx='2.6' ry='5'/><ellipse cx='32' cy='46' rx='2.6' ry='5'/><ellipse cx='18' cy='32' rx='5' ry='2.6'/><ellipse cx='46' cy='32' rx='5' ry='2.6'/></g><circle cx='32' cy='32' r='4.5' fill='%23cfa556' stroke='%234f8571' stroke-width='.8'/><g fill='%236fa8a2'><path d='M0 0h13L0 13z'/><path d='M64 0H51l13 13z'/><path d='M0 64h13L0 51z'/><path d='M64 64H51l13-13z'/></g></svg>");
  --tilestrip:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='14' viewBox='0 0 28 14'><rect width='28' height='14' fill='%23e5ead9'/><path d='M7 1l6 6-6 6-6-6z' fill='%239dbba7' stroke='%234f8571' stroke-width='.8'/><path d='M21 1l6 6-6 6-6-6z' fill='%23d99c94' stroke='%234f8571' stroke-width='.8'/><circle cx='7' cy='7' r='1.6' fill='%23cfa556'/><circle cx='21' cy='7' r='1.6' fill='%23cfa556'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .35 0 0 0 0 .25 0 0 0 .07 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
}
.wrap{max-width:540px;margin:0 auto;padding-bottom:100px}
a{color:inherit}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* 手绘描边：真实边框被替换成带抖动滤镜的伪元素 */
.rough{position:relative;isolation:isolate;border:0 !important;background:transparent !important}
.rough::before{content:"";position:absolute;inset:0;border:2px solid var(--ink);border-radius:var(--r,16px);background-color:var(--bg,var(--card));background-image:var(--bgimg,none);filter:url(#rough);pointer-events:none;z-index:-1}
.rough::after{content:"";position:absolute;inset:0;border-radius:var(--r,16px);background:var(--sh,rgba(44,58,51,.14));transform:translate(4px,5px);filter:url(#rough);pointer-events:none;z-index:-2}

/* 顶部 */
.top{position:relative;padding:20px 16px 0;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background-image:var(--tile);background-size:56px;opacity:.75}
.title-card{--bg:rgba(251,248,238,.96);padding:16px 16px 12px;--r:18px;--sh:var(--jade)}
.title-card h1{margin:0;font-family:var(--hand);font-weight:400;font-size:31px;letter-spacing:2px;line-height:1.15}
.title-card h1 span{color:var(--terra)}
.sub{margin:3px 0 10px;color:var(--muted);font-size:13px}
.flower{position:absolute;width:46px;height:46px;z-index:3}
.flower.f1{right:12px;top:10px;transform:rotate(12deg)}
.flower.f2{right:52px;top:30px;width:30px;height:30px;transform:rotate(-20deg)}
.clocks{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;position:relative;z-index:3}
.clock{text-align:center;padding:5px 2px;background:#fff;border:1.5px dashed var(--ink);border-radius:12px}
.clock b{display:block;font-family:var(--num);font-size:23px;line-height:1.1}
.clock small{font-size:11px;color:var(--muted)}
.clock.local{background:var(--mint);border:2px solid var(--deep)}
.clock.local b{font-size:30px;color:var(--deep)}
.clock.local small:first-child{color:var(--deep);font-weight:600}
.countdown{margin-top:8px;font-size:13px;text-align:center;color:var(--deep);position:relative;z-index:3}
.shophouses{position:relative;display:block;width:100%;height:96px;margin-top:14px}
.five-foot{position:relative;height:14px;background-image:var(--tilestrip);background-size:28px 14px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}

/* 日期条 */
.days{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:64px;text-align:center;padding:7px 4px 8px;cursor:pointer;font-family:inherit;color:inherit;--r:12px;
  --bgimg:linear-gradient(135deg,var(--sage) 9px,transparent 9px),linear-gradient(225deg,var(--sage) 9px,transparent 9px),linear-gradient(45deg,var(--sage) 9px,transparent 9px),linear-gradient(315deg,var(--sage) 9px,transparent 9px)}
.chip .d{font-family:var(--num);font-size:24px;line-height:1}
.chip .w{font-size:12px;color:var(--muted)}
.chip .c{display:inline-block;margin-top:3px;font-size:11px;padding:0 7px;border-radius:9px;color:#fff;background:var(--jade)}
.chip .c.bkk{background:var(--terra)}
.chip .c.sz{background:var(--ochre)}
.chip.on{--bg:var(--mint);transform:translateY(-3px) rotate(-1.5deg);--sh:var(--ink)}
.chip.today .w::after{content:" · 今天";color:var(--rose);font-weight:600}

/* 卡片 */
main{padding:2px 16px}
.tab{display:none}
.tab.active{display:block}
.card{--bg:var(--card);padding:15px 15px 13px;margin:16px 0}
.card h3{margin:0 0 10px;font-family:var(--hand);font-weight:400;font-size:20px;display:flex;align-items:center;gap:7px;color:var(--deep)}
.card h3 .ic{width:24px;height:24px;flex:0 0 auto;color:var(--jade)}
.card h3 .tag{margin-left:auto;font-family:var(--body);font-size:11px;color:var(--muted)}
.dayhead{margin:6px 0 0;padding:4px 2px;display:flex;align-items:flex-end;gap:10px}
.dayhead .t{font-family:var(--hand);font-size:27px;line-height:1.2}
.dayhead .m{color:var(--muted);font-size:13px}
.dayhead .no{font-family:var(--num);font-size:46px;line-height:.9;color:var(--terra)}
.hint{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.ic{display:inline-block;vertical-align:-4px}
.ribbon{display:inline-block;font-family:var(--hand);font-size:13px;padding:1px 10px;background:var(--ochre-l);border:1.5px solid var(--ink);border-radius:10px;transform:rotate(-2deg)}

/* 天气 */
.wx{display:flex;align-items:center;gap:14px}
.wx .ico{font-size:44px;line-height:1}
.wx .tmp{font-family:var(--num);font-size:44px;line-height:1}
.wx .desc{font-size:13px;color:var(--muted)}
.wx-day{margin-top:9px;padding:7px 10px;border-radius:10px;background:var(--mint);font-size:13px}
.wx-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;padding:2px 9px;border-radius:12px;background:#fff;border:1.5px solid var(--ink)}
.pill.warn{background:var(--ochre-l)}

/* 地图 */
#map{height:250px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#e4e6d6}
#map .leaflet-tile-pane{filter:sepia(.4) saturate(.85) hue-rotate(28deg) brightness(1.03)}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--terra);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.pin span{transform:rotate(45deg);color:#fff;font-family:var(--num);font-size:17px;font-weight:700}
.pin.fixed{background:var(--jade)}
.mapfail{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}

/* 行程 */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:2px dashed var(--sage)}
.tl li{position:relative;padding:0 0 16px 42px}
.tl .no{position:absolute;left:2px;top:0;width:28px;height:28px;border-radius:50%;background:var(--terra);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:18px;font-weight:700}
.tl .no.fixed{background:var(--jade)}
.tl .no.none{background:var(--card);color:var(--ink)}
.tl .time{font-family:var(--num);font-size:21px;color:var(--turq);margin-right:6px}
.tl .name{font-weight:600}
.badge{display:inline-block;font-size:10px;padding:0 6px;border-radius:8px;margin-left:6px;vertical-align:2px}
.badge.idea{background:var(--ochre-l);color:#7d5d18;border:1px solid var(--ochre)}
.badge.fixed{background:var(--mint);color:var(--deep);border:1px solid var(--jade)}
.tl .d{font-size:13px;color:var(--muted);margin:2px 0 4px}
.tl .go,.tl .tip{font-size:12.5px;margin:2px 0;display:flex;gap:5px;align-items:flex-start}
.tl .go{color:var(--deep)}
.tl .tip{color:#7d5d18}
.lore{margin:6px 0 2px}
.lore summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--deep);list-style:none;display:inline-block;padding:3px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--mint)}
.lore summary::-webkit-details-marker{display:none}
.lore[open] summary{background:var(--ochre-l)}
.lore p{margin:7px 0 0;padding:9px 11px;font-size:13px;line-height:1.75;border:1.5px dashed var(--ink);border-radius:12px;background:var(--card)}
.svgmap{width:100%;height:auto;display:block;background:#e9ecd9}
.svgmap text{font-family:var(--body);font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:#fbf8ee;stroke-width:3px;stroke-linejoin:round}
.svgmap .num{font-family:var(--num);font-size:15px;font-weight:700;fill:#fff;stroke:none}
.mapnote{padding:6px 10px 2px;font-size:11.5px;color:var(--muted);text-align:center}
.ne{font-size:12px;color:var(--muted);font-style:italic;margin:0 0 2px;line-height:1.35}
.ne.th{font-style:normal;margin-top:-1px}
.leg{font-size:11.5px;color:var(--muted);margin:-4px 0 6px 0;padding:2px 8px;background:rgba(160,130,90,.10);border-radius:8px;display:inline-block}
.leg small{opacity:.7}
.thx{font-size:13px;line-height:1.5}
.addr3{margin:6px 0;padding:8px 10px;border:1.5px dashed var(--ink);border-radius:12px;background:var(--card);font-size:12.5px;line-height:1.5}
.addr3 .ah{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.addr3 .en{color:var(--muted)}
.addr3 .thx{font-size:14px;margin-top:2px}
.bk{margin-top:8px}
.bkb{font-family:inherit;font-size:13px;padding:4px 14px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink)}
.bkb.on{background:#ffe9b8;border-color:#c98a00;color:#6a4500;font-weight:700}
.syncbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;padding:6px 10px;border:1.5px dashed var(--ink);border-radius:12px;background:var(--card);font-size:12.5px}
.syncbar input{width:110px;padding:4px 8px;font:inherit;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.sharepanel{margin:0 0 10px;padding:8px 10px;border:1.5px dashed var(--ink);border-radius:12px;background:var(--card)}.sharepanel textarea{width:100%;box-sizing:border-box;font:12px/1.4 monospace;margin:4px 0;border:1.5px solid var(--ink);border-radius:8px;padding:6px;background:#fff;color:var(--ink)}
.syncst{flex:1;min-width:120px;color:var(--muted)}
.nlist{margin-top:6px}
.nrow{padding:6px 8px;margin-bottom:5px;border-radius:10px;background:rgba(160,130,90,.10);font-size:13px;line-height:1.45}
.nrow.mine{background:rgba(120,170,130,.16)}
.nrow .nm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.nrow .nm small{color:var(--muted)}
.nrow .nm button{font:inherit;font-size:11.5px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.nrow .nt2{white-space:pre-wrap;word-break:break-word}
.nbtns{display:flex;gap:8px;margin-top:6px}
.badge.custom{background:var(--pink-l);color:var(--rose);border:1px solid var(--pink)}
.lore p.en{margin-top:6px;border-style:dotted;color:#44524a;font-size:12.5px}
.act{margin-top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chk{font-family:inherit;font-size:13px;padding:4px 14px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink)}
.chk.on{background:var(--mint);border-color:var(--jade);color:var(--deep);font-weight:700}
.tl li.visited .name{color:var(--deep)}
.tl li.visited .no{background:var(--deep)}
.nt{width:100%}
.nt summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none}
.nt summary::-webkit-details-marker{display:none}
textarea.pn{width:100%;margin-top:5px;padding:8px 10px;font:inherit;font-size:13px;border:1.5px dashed var(--ink);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
.delx{background:var(--rose-l)}
.addp{margin-top:6px}
#addpForm{margin-top:10px;display:flex;flex-direction:column;gap:8px}
#addpForm input[type=text],#addpForm input:not([type]),#addpForm input[type=time],#addpForm select{font:inherit;font-size:14px;padding:7px 10px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
#addpForm .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#addpForm select{flex:1}
.fd{border-top:1px dashed rgba(44,58,51,.25);padding:6px 0}
.fd summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
.fd summary::-webkit-details-marker{display:none}
.fd .cnt{font-family:var(--num);font-size:19px;color:var(--turq)}
.fl{list-style:none;margin:6px 0 2px;padding:0}
.fl li{display:flex;gap:8px;font-size:13px;padding:3px 0}
.fl .mk{width:16px;flex:0 0 16px;text-align:center;color:var(--muted)}
.fl li.ok .mk{color:var(--deep);font-weight:700}
.fl li.no b{color:var(--muted);font-weight:600}
.fl small{color:var(--muted)}
.fl .fn{font-size:12px;color:#7d5d18;margin-top:1px;white-space:pre-wrap}
.tl .go .ic,.tl .tip .ic{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{font-size:12px;text-decoration:none;padding:3px 10px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;white-space:nowrap;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.g{background:var(--turq-l)}
.btn.a{background:var(--mint)}
.btn.x{background:var(--rose-l);color:var(--rose);border-color:var(--rose)}
.btn.solid{background:var(--deep);color:#fff;border-color:var(--deep)}
.btn[disabled]{opacity:.45;cursor:default}

/* 清单 / 待办 */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(44,58,51,.25)}
.todo li:last-child{border-bottom:0}
.todo input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--jade);flex:0 0 auto}
.todo .txt{flex:1;font-size:14px}
.todo .txt small{display:block;color:var(--muted);font-size:12px}
.todo li.done .txt{text-decoration:line-through;color:var(--muted)}
.todo .del{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:0 4px}
.addrow{display:flex;gap:6px;margin-top:9px}
.addrow input,.addrow select,.form input,.form select{min-width:0;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
.addrow input{flex:1}
.addrow button,.form button{padding:8px 13px;border:1.5px solid var(--ink);border-radius:12px;background:var(--jade);color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.progress{height:12px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:4px 0 2px}
.progress i{display:block;height:100%;background-image:var(--tilestrip);background-size:24px 12px;transition:width .3s}
.group-title{font-family:var(--hand);font-size:17px;color:var(--terra);margin:12px 0 2px}
.remind{padding:10px 12px;background:var(--ochre-l);border-radius:12px;font-size:13.5px;margin:4px 0}
.remind b{color:#7d5d18}

/* 新闻 */
.news{list-style:none;margin:0;padding:0}
.news li{padding:7px 0;border-bottom:1px dashed rgba(44,58,51,.25);font-size:13.5px}
.news li:last-child{border-bottom:0}
.news a{text-decoration:none}
.news .meta{font-size:11px;color:var(--muted)}
.alert{display:inline-block;background:var(--rose);color:#fff;font-size:10px;padding:0 5px;border-radius:6px;margin-right:4px}
.sos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.sos a{text-decoration:none;font-size:12px;padding:3px 10px;border-radius:12px;background:var(--rose-l);border:1.5px solid var(--rose);color:var(--rose)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}

.notes-btn{display:block;text-align:center;text-decoration:none;font-family:var(--hand);font-size:19px;padding:13px;margin:18px 0;--bg:var(--mint);--sh:var(--ink)}
.notes-btn small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}

/* 美食 / 购物 */
.cityline{margin:16px 0 2px;font-family:var(--hand);font-size:25px;display:flex;align-items:center;gap:8px}
.cityline .ic{width:28px;height:28px;color:var(--terra)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fchip{padding:4px 12px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.fchip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.place{padding:11px 0;border-bottom:1.5px dashed rgba(44,58,51,.28)}
.place:last-child{border-bottom:0}
.place .top2{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.place .nm{font-weight:600;font-size:15px}
.place .dist{margin-left:auto;font-family:var(--num);font-size:18px;color:var(--turq)}
.place .ds{font-size:13px;color:var(--muted);margin:2px 0 2px}
.cat{font-size:10px;padding:0 7px;border-radius:8px;border:1px solid var(--ink)}
.cat.food{background:var(--pink-l)} .cat.coffee{background:#e7dccb} .cat.drink{background:var(--turq-l)} .cat.dessert{background:var(--ochre-l)}
.where{font-size:12px;color:var(--deep)}

/* 锦囊 */
.fx{display:grid;grid-template-columns:1fr auto 1.1fr;gap:8px;align-items:center}
.fx input,.fx select{width:100%;min-width:0;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.fx input{font-family:var(--num);font-size:24px}
.fx select{font-family:var(--body);font-size:14px}
.fx .eq{font-family:var(--num);font-size:26px;color:var(--muted)}
.fxout{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fxout div{text-align:center;padding:6px 2px;border:1.5px dashed var(--ink);border-radius:10px;background:#fff}
.fxout b{display:block;font-family:var(--num);font-size:24px;line-height:1.1;color:var(--deep)}
.fxout small{font-size:11px;color:var(--muted)}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px dashed rgba(44,58,51,.22)}
.tips li:last-child{border-bottom:0}
.tips li::before{content:"✿";position:absolute;left:1px;top:6px;color:var(--pink);font-size:14px}
.tips b{color:var(--deep)}
.phr{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.phr .zh{color:var(--muted)}
.phr .say{font-weight:600}
.phr .say small{display:block;font-weight:400;font-size:12px;color:var(--turq)}

/* 钱包 */
.ticket{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 12px;margin:8px 0;background:#fff;border:1.5px solid var(--ink);border-radius:12px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--card);border:1.5px solid var(--ink)}
.ticket::before{left:-8px;clip-path:inset(0 0 0 50%)} .ticket::after{right:-8px;clip-path:inset(0 50% 0 0)}
.ticket .city{font-family:var(--hand);font-size:19px}
.ticket .city small{display:block;font-family:var(--body);font-size:11px;color:var(--muted)}
.ticket .mid{text-align:center;font-size:11px;color:var(--muted)}
.ticket .mid .ic{width:26px;height:26px;color:var(--terra)}
.ticket .r{text-align:right}
.ticket .tt{display:block;font-family:var(--num);font-size:28px;line-height:1;color:var(--deep);margin-top:2px}
.ticket .fno{font-family:var(--num);font-size:19px;color:var(--terra);font-weight:700}
.tl .ticket{margin:6px 0 2px}
.tl .no.flt{background:var(--ochre)}
.tl .no.flt .ic{width:16px;height:16px;color:#fff}
.ticket .meta{grid-column:1/-1;border-top:1.5px dashed rgba(44,58,51,.3);padding-top:6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.hotel{padding:10px 0;border-bottom:1.5px dashed rgba(44,58,51,.28)}
.hotel:last-child{border-bottom:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.form .full{grid-column:1/-1}
.ledger{list-style:none;margin:10px 0 0;padding:0}
.ledger li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(44,58,51,.25);font-size:13.5px}
.ledger .amt{margin-left:auto;font-family:var(--num);font-size:19px;color:var(--deep);white-space:nowrap}
.ledger small{color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.sumgrid div{background:#fff;border:1.5px dashed var(--ink);border-radius:10px;padding:6px;text-align:center}
.sumgrid b{display:block;font-family:var(--num);font-size:24px;color:var(--deep);line-height:1.1}
.sumgrid small{font-size:11px;color:var(--muted)}
.settle{font-size:13.5px;padding:4px 0}

/* 给司机看 */
.overlay{position:fixed;inset:0;z-index:2000;background:var(--card);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background-image:var(--tile);background-size:72px}
.overlay.show{display:flex}
.overlay .box{--bg:var(--card);padding:26px 20px;max-width:520px;width:100%;--r:20px}
.overlay .lbl{font-size:14px;color:var(--muted)}
.overlay .big{font-size:30px;font-weight:700;line-height:1.35;margin:10px 0}
.overlay .addr{font-size:22px;line-height:1.5}

/* 底部 tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper)}
.tabbar .strip{height:10px;background-image:var(--tilestrip);background-size:20px 10px;border-top:2px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.tabbar .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tb{border:0;background:none;padding:4px 0 2px;cursor:pointer;font-family:var(--hand);font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;--r:14px}
.tb svg{width:25px;height:25px}
.tb.on{color:var(--deep);--bg:var(--mint)}
.tb:not(.on)::before,.tb:not(.on)::after{display:none}
.foot{text-align:center;font-size:11px;color:var(--muted);margin:18px 0 6px}

    {id:"d1124-2", t:"09:00", n:"福康宁公园 Fort Canning Park", ne:"Fort Canning Park", en:"Fort Canning Park Singapore", lat:1.2950, lon:103.8458, s:"fixed", d:"24 小时开放，免费；看点：Fort Gate、Spice Garden（180 多种香料植物）、东盟雕塑园、历史花园；约 45 分钟，边逛边往土生博物馆那一侧走", go:"从 Old Hill Street Police Station 往山上走，步行约 5–10 分钟", tip:"早上凉快；山上蚊子多，带驱蚊液；9:50 前要走到 Armenian Street"},

    {id:"d1124-4", t:"12:30", n:"午饭：HolyCrab（Capitol）", ne:"Lunch · HolyCrab (Capitol)", en:"HolyCrab 13 Stamford Rd #01-85 Capitol Singapore", lat:1.2937, lon:103.8512, s:"fixed", d:"斯里兰卡式螃蟹：绿辣椒蟹、胡椒蟹、配炸馒头；在 Capitol Kempinski 的 13 Stamford Rd #01-85，离土生博物馆步行约 10 分钟，吃完去国家博物馆也顺路", go:"电话 +65 8444 2722，或在 Chope 上订位", tip:"店很小，有评论说常常客满，建议先订 12:30 的位子；人均约 S$40，螃蟹按重量计价，点前问清价格；11/22 在 Jumbo 吃过一次螃蟹，这顿可以点小份；14:00 前要吃完走"},
    {id:"d1124-5", t:"13:45", n:"新加坡国家博物馆", ne:"National Museum of Singapore", en:"National Museum of Singapore 93 Stamford Rd", lat:1.2966, lon:103.8485, s:"fixed", d:"新加坡最古老的博物馆，约 5 小时，计划 18:30–19:00 之间离开（博物馆 19:00 关门）", go:"从 Capitol 步行约 10–12 分钟", tip:"每天 10:00–19:00，外国游客约 S$15；新加坡历史馆之前有一段时间在整修，目前开放哪些展厅我没查到，去之前看官网（nationalmuseum.nhb.gov.sg）；5 小时较长，可中途去里面的咖啡馆休息"},

    {id:"d1124-9", t:"20:30", n:"夜间动物园 Night Safari", ne:"Night Safari", en:"Night Safari Singapore 80 Mandai Lake Rd", lat:1.4022, lon:103.7897, s:"fixed", d:"世界首个夜间动物园。约 19:15 开门（也有网站写 18:30），24:00 关门，最晚 23:15 入场，一般要玩 3 小时。4 条步行道：Fishing Cat、Leopard、East Lodge、Wallaby；园内小火车约 30–40 分钟。表演场次：Creatures of the Night（动物表演，圆形剧场，约 20 分钟）每晚 19:30、20:30、21:30；Twilight 火舞表演（入口广场，免订位）周日到周四 20:00、21:00，周五、周六 20:00、21:00、22:00", go:"回程打车约 25–30 分钟，先在 Grab 上叫好；你们计划 23:30 左右离开", tip:"建议这样排：20:30 进园 → 21:00 在入口广场看火舞 → 21:15 去圆形剧场占位 → 21:30 看 Creatures of the Night → 22:00 坐小火车 → 22:40 走两条步道 → 23:20 出园；圆形剧场座位先到先得；表演时间来自第三方网站，以官网和现场告示为准；门票约 S$58 起，含小火车约 S$64，提前 2–5 天买；动物区禁止闪光灯；晚上冷可以带件外套"},
    {id:"d1124-10", t:"23:30", n:"离开夜间动物园，去芽笼宵夜", ne:"Leave Night Safari for Geylang", s:"idea", d:"在出口叫 Grab（先在 App 里选好目的地），到芽笼约 35–45 分钟（估计），00:10 前后到", nov:true},

    {id:"d1124-12", t:"01:15", n:"打车回酒店", ne:"Back to the hotel", en:"Paradox Singapore Merchant Court", lat:1.2887, lon:103.8466, s:"idea", d:"芽笼 → Clarke Quay 约 15–20 分钟，大约 01:30 到酒店", tip:"明早 11/25 的东亚早餐如果起不来，可以推到 10:00，周三东亚开到 14:00", nov:true}

    {id:"d1126-5", t:"11:20", n:"Shiseido 森林谷 · 雨漩涡", ne:"Shiseido Forest Valley & Rain Vortex", en:"Jewel Changi Airport Rain Vortex", lat:1.3602, lon:103.9898, s:"idea", d:"Shiseido Forest Valley 是四层楼的室内森林，两条步道从一层爬到顶层，全天开放；40 米高的 HSBC 雨漩涡（Rain Vortex）白天运行，晚上才有灯光秀（周一到周四 20:00、21:00），你们是白天，只能看到瀑布本身", go:"从一层沿步道往上走到五层的 Canopy Park，约 20–30 分钟，边走边拍", tip:"雨漩涡的运行时间有网站写 10:00 起、有网站写 11:00 起，11:20 去不会错"},
    {id:"d1126-6", t:"12:10", n:"Canopy Park（Jewel 五层）", ne:"Canopy Park (Jewel Level 5)", en:"Canopy Park Jewel Changi Airport Level 5", lat:1.3602, lon:103.9898, s:"idea", d:"五层空中花园，周一到周四 10:00–22:00。付费项目：Canopy Bridge（50 米长、离地 23 米，有一段玻璃地板）、Manulife Sky Nets（行走网 / 弹跳网）、树篱迷宫和镜子迷宫、Discovery 滑梯、雾碗 Foggy Bowls；免费的有 Topiary Walk 和 Petal Garden", go:"约 60 分钟，13:10 前要回一层", tip:"门票价格我没核实到，官网有联票，想玩提前在 Jewel 官网买；穿平底鞋；时间紧就只逛免费区"},
    {id:"d1126-7", t:"13:10", n:"早到值机 · 寄行李", ne:"Early Check-in Lounge (Jewel Level 1)", en:"Jewel Changi Airport Early Check-in Lounge Level 1", lat:1.3602, lon:103.9898, s:"fixed", d:"酷航（Scoot）可在 Jewel 一层的早到值机柜台办理，TR610 起飞前 3 小时开始，也就是 13:00 起。办完行李就不用再拿，空手吃饭、过关", go:"先去一层行李寄存处取行李，再去早到值机柜台；不托运的话，也可以直接去 T1 值机排（酷航在 T1，据第三方资料是 5–7 排，以现场屏幕为准）", tip:"酷航廉价票的托运行李要提前加购，现场加购更贵；早到值机的开放时间各来源写的不一样，以酷航和 Jewel 官网为准"},
    {id:"d1126-8", t:"13:40", n:"午饭 · 伴手礼（Jewel）", ne:"Lunch & Gifts at Jewel", en:"Jewel Changi Airport Level 5 Garden Dining", lat:1.3602, lon:103.9898, s:"idea", d:"午饭三选一：① 五层花园餐饮区，对着雨漩涡吃：Arteastiq、Jack's Place、KANTIN；② 二层 Shake Shack（美式汉堡）；③ 一层本地品牌区的 Ya Kun 亚坤，咖椰吐司配半熟蛋收尾。饭后在一层本地品牌区买伴手礼：Rich & Good Cake Shop（娘惹糕 kueh）、Bengawan Solo（娘惹糕、凤梨挞）", go:"一层本地品牌区在早到值机柜台所在的同一层", tip:"娘惹糕当天吃完，要带上飞机就挑凤梨挞、蛋卷；咖椰酱是半液体，过关前买的只能托运，过海关后的店里买可以随身带；以上店家我没逐家核对当天营业时间"},
    {id:"d1126-9", t:"14:40", n:"去 T1 出境", ne:"To Terminal 1 Immigration", en:"Changi Airport Terminal 1", lat:1.3618, lon:103.9893, s:"idea", d:"从 Jewel 一层走连廊进 T1 到达大厅，再上二层出发层过边检（出示登机牌）；TR610 在 T1 起飞", tip:"据第三方资料，T1 没有集中安检，行李安检在登机口做，以现场告示为准；15:15 前到登机口，T1 很大，先看屏幕上的登机口", nov:true},
    {id:"d1126-10", t:"16:00", n:"TR610 飞往曼谷", ne:"Flight TR610 to Bangkok", s:"fixed", fl:1},
    {id:"d1126-11", t:"17:35", n:"抵达曼谷素万那普机场", ne:"Arrive · Suvarnabhumi Airport", en:"Suvarnabhumi Airport", lat:13.6900, lon:100.7501, s:"fixed", d:"曼谷比新加坡慢 1 小时，手机时间会自动调整", go:"带着行李建议直接打 Grab / 机场出租车，约 1 小时（晚高峰可能更久）", tip:"出口有电话卡柜台；提前填好 TDAC；出租车坚持打表，说 meter please"},
    {id:"d1126-12", t:"20:30", n:"入住曼谷河畔安凡尼酒店", ne:"Check-in · AVANI+ Riverside Bangkok", en:"AVANI+ Riverside Bangkok Hotel", lat:13.7195, lon:100.5040, s:"fixed", d:"阿瓦尼河景房，只住 1 晚", tip:"明早 7:30 左右要退房出发去安帕瓦，今晚就把行李分好：一个小包装 11/27–11/28 两晚用的东西，大箱子放包车"},
    {id:"d1126-13", t:"21:30", n:"Asiatique 河滨夜市（夜宵）", ne:"Asiatique The Riverfront (supper)", en:"Asiatique The Riverfront 2194 Charoen Krung Rd", lat:13.7045, lon:100.5035, s:"idea", d:"曼谷河边的大型夜市和购物区，每天 16:00–24:00，在河对岸；有 60 米高的摩天轮（一圈约 20 分钟）、小吃摊和餐厅，可以当夜宵", go:"酒店有免费接驳船到 Saphan Taksin 码头（08:00–23:15，来自酒店官网），再换乘 Asiatique 的免费船（约 10–15 分钟）；回程船的末班时间到了 Asiatique 码头问清", tip:"你们 20:30 入住，21:15 前出门比较从容；累了就在酒店河景餐厅吃，或打车去 Charoen Nakhon Road 上的 Heng Hoi Tod Chaw Lae（1301 Charoen Nakhon Rd，每天 9:30–22:00，海蛎煎和炒面，离酒店多远我没核实）；ICONSIAM 打车约 7 分钟（酒店官网），商场一般 22:00 前后关门"}
  ], todos:["给班印轩老板发消息 / 打电话：订明早的布施（斋饭）和早餐，问清楚几点、多少钱", "向司机或美功当地人确认当天火车时刻（我查到的是 2022 年的旧表）", "带够现金：小摊、船、庙都收现金", "驱蚊液、防晒、拖鞋装进随身小包", "确认安帕瓦水上市场周五的开市时间"]},

  { date:"2026-11-27", city:"bkk", wx:{"name": "安帕瓦 / 美功", "lat": 13.426, "lon": 99.957}, title:"美功铁道市场 · 树抱佛庙 · 安帕瓦水上市场 · 萤火虫", items:[
    {"id": "d1127-1", "t": "09:00", "n": "退房，包车出发", "ne": "Check-out · Charter car departs", "en": "AVANI+ Riverside Bangkok Hotel", "lat": 13.7195, "lon": 100.504, "s": "idea", "d": "酒店含双早，吃完早餐 9:00 退房，车 9:00 来接；大行李留在车上，今晚和明晚只带一个小包", "tip": "9:00 出发已经错开最早的高峰，往西南出城方向通常比进城好走，但仍给自己留机动时间。跟司机说清路线：美功 → 树抱佛庙 → 安帕瓦班印轩；明天 安帕瓦 → 柴瓦塔那兰寺 → 大城酒店", "nov": true},
    {"id": "d1127-3", "t": "11:00", "n": "美功铁道市场 · 看火车进站", "ne": "Maeklong Railway Market · Train Arrival", "en": "Maeklong Railway Market", "lat": 13.4074, "lon": 99.9997, "s": "idea", "d": "约 11:00 到（9:00 出发，路上约 2 小时，是我的估算），先逛菜市场；11:10 左右火车进站，11:30 左右又从站里开出，可以一次看两趟（下一趟进站要等到 14:30，太久，不建议为它留下）。如果路上堵得晚到，11:30 的开出也值得看", "go": "从曼谷包车约 2 小时（我的估算）", "tip": "时刻表我只查到一份（thaitrainguide，2022 年更新）：到站 8:30 / 11:10 / 14:30 / 17:40，开出 6:20 / 9:00 / 11:30 / 15:30；另一来源和它对不上。请让司机或当地摊贩当天确认。听到广播铃就站到铁轨边安全位置，摊贩会收篷，火车贴着摊位慢慢开过，拍视频站稳、别踩轨道"},
    {"id": "d1127-7", "t": "12:00", "n": "午饭（美功小镇）", "ne": "Lunch in Maeklong", "s": "idea", "d": "一篇旧游记提到三家：Nam Prik Puthon（市场外大路边的小摊，十几种辣椒酱配蔬菜和蛋饼）；泰国酒店（Rong Raem Thai Sawadee）的老式海南鸡饭；Rong Krua 餐厅（美功本地菜、美功式冬阴功）。想吃海鲜：Don Hoi Lot 河口一带有海鲜餐厅和海鲜市场，离车站几公里", "tip": "以上来自游记，不是实时信息，我没核实现在是否营业，到了在地图上搜一下名字再决定；吃完就走，不必再等下一趟火车"},
    {"id": "d1127-8", "t": "13:15", "n": "树抱佛庙（Wat Bang Kung）", "ne": "Wat Bang Kung (Banyan-Embraced Temple)", "en": "Wat Bang Kung Samut Songkhram", "s": "idea", "d": "大殿被大榕树的根整个包住，是安帕瓦一带最出名的小景点，免费参观，约 8:00 到 17:00（也有来源写到 18:00）", "go": "从美功开车约 20–30 分钟（估）；离安帕瓦水上市场约 6 公里 / 10 分钟", "tip": "遮肩过膝、脱鞋；别爬树根、别踩佛像；逛 30–45 分钟就够", "tt": "约 20–30 分钟 · 包车（估）"},
    {"id": "d1127-4", "t": "14:30", "n": "入住班印轩家庭旅馆", "ne": "Check-in · Baan Ing Suan, Amphawa", "en": "Baan Ing Suan Amphawa", "lat": 13.4256, "lon": 99.9553, "s": "fixed", "d": "大床房（带阳台），只住 1 晚", "tip": "先放好行李，当面和老板约好：①明早 5 点左右划船给僧侣的布施（斋饭包含什么、几点出发、多少钱）②老板娘做的早餐几点吃；小旅馆楼梯窄，晚上河边蚊子多", "tt": "约 10 分钟 · 包车（约 6 km，估）"},
    {"id": "d1127-5", "t": "15:00", "n": "安帕瓦水上市场", "ne": "Amphawa Floating Market", "en": "Amphawa Floating Market", "lat": 13.4261, "lon": 99.9564, "s": "idea", "d": "周五下午开市，傍晚到夜里最热闹：船上现烤河虾、烤海鲜、粿条、泰式糕点、椰子糖", "go": "从民宿步行即到", "tip": "我查到的开市时间大约 14:00–20:00，各来源略有出入；现金备小面额。这里不是丹嫩沙多那种清晨水上市场，傍晚才对"},
    {"id": "d1127-9", "t": "16:30", "n": "安帕瓦周边小逛（选一项）", "ne": "Around Amphawa (optional)", "s": "idea", "d": "河边的安帕瓦寺（Wat Amphawan Chetiyaram，拉玛二世诞生地一带，有纪念性建筑）、拉玛二世纪念公园、运河边的老木屋街；或者坐长尾船看河边生活", "tip": "这几处我没查到可靠的开放时间，到现场看；不想走就留在民宿阳台歇一会儿，晚上还有萤火虫", "tt": "约 5–10 分钟 · 步行（估）"},
    {"id": "d1127-10", "t": "18:00", "n": "晚饭（安帕瓦）", "ne": "Dinner in Amphawa", "s": "idea", "d": "最省事：在水上市场里吃（现烤河虾、粿条、咖喱、鲭鱼 Pla Tu 是美功府特产，糕点和小吃一般 20–70 泰铢）。想坐下慢慢吃：Chao Le Restaurant（50/6 Moo 6，靠近萤火虫村，一篇博客提到，电话 034-752-681）或 Moo Dang Restaurant（Bang Chang，烤红叉烧饭和面，据说每天营业）", "tip": "两家餐厅我都没核实营业时间，先打电话或问老板；晚上 19:30 要出船，18:00–19:00 吃完比较从容", "tt": "约 5–10 分钟 · 步行（估）"},
    {"id": "d1127-6", "t": "19:30", "n": "夜游萤火虫", "ne": "Firefly Boat Tour", "s": "idea", "d": "天黑后坐小船看河边树上的萤火虫", "tip": "让老板帮忙订船最省心；晚上防蚊，别开闪光灯、别用手电照树；上船穿救生衣", "tt": "约 10 分钟 · 步行到码头（估）"}
  ], todos:["寺庙着装：遮肩，长裤或过膝裙", "带够现金：联票 300、嘟嘟车、泰服、晚饭（Baan Ta Koh Rai 只收现金）", "跟司机确认明天路线：安帕瓦 → 柴瓦塔那兰寺（停约 1.5 小时）→ 夏玛雷斯登斯酒店（U Thong 路 5 号）", "给大城酒店发消息：问能不能提前入住 / 寄存行李，附近哪家租泰服，请前台帮忙订 Baan Ta Koh Rai 18:30（+66 89 764 5119）", "防蚊、防晒、带水", "夜里把换洗衣物整理好，明早退房"]},

  { date:"2026-11-28", city:"bkk", wx:{"name": "大城", "lat": 14.3532, "lon": 100.56}, title:"清晨布施 · 柴瓦塔那兰寺 · 入住大城 · 步行逛古迹", items:[
    {"id": "d1128-1", "t": "05:30", "n": "给僧侣布施（划船托钵）", "ne": "Alms-Giving to Monks by Boat", "en": "Baan Ing Suan Amphawa", "lat": 13.4256, "lon": 99.9553, "s": "idea", "d": "5:00 起床，在民宿河边等僧侣的小船经过，把前一晚订好的斋饭放进钵里", "tip": "经过的时间每个民宿不一样，问老板；遮肩过膝、保持安静；女生不要直接触碰僧人，食物放进钵里；拍照先问可不可以，不开闪光灯"},
    {"id": "d1128-8", "t": "06:30", "n": "民宿早餐（老板娘做）", "ne": "Breakfast at the guesthouse", "s": "idea", "d": "提前向老板订好；吃完收拾行李，7:45 前退房", "tip": "大行李在车上，随身小包别落下"},
    {"id": "d1128-2", "t": "08:00", "n": "包车去大城（途中停柴瓦塔那兰寺）", "ne": "Drive to Ayutthaya (stop at Wat Chaiwatthanaram)", "s": "idea", "d": "安帕瓦 → 柴瓦塔那兰寺约 2.5–3 小时（我的估算，没有可靠来源），预计 10:45 前后到；从南边进大城，这座寺在城岛西侧河对岸，正好顺路", "tip": "周六上午环城路可能堵，路上让司机停一次休息站；跟司机说好：在柴瓦塔那兰寺门口等约 1.5 小时，然后直接送去酒店", "nov": true},
    {"id": "d1128-6", "t": "10:45", "n": "柴瓦塔那兰寺（路上顺路停）", "ne": "Wat Chaiwatthanaram (stop on the way)", "en": "Wat Chaiwatthanaram", "lat": 14.3441, "lon": 100.5435, "s": "idea", "d": "高棉风格的大佛塔，中央主塔约 35 米，四周四座小塔，是大城最上镜的古迹之一；上午光线偏硬、很热，约逛 1–1.5 小时。寺门口有好几家泰服出租店（泰文网帖），想在这里穿泰服拍，见「租泰服」那一条", "go": "从安帕瓦包车约 2.5–3 小时（估）；车停寺门口，司机等你们", "tip": "先买联票 300 泰铢（见「大城古迹」那一条）；联票隔天是否还能用我没核实，买的时候问清。离今晚的酒店：直线约 2 km（我用坐标估的），但寺在河对岸、要绕桥，有来源写它离大城市区约 6–7 km，所以不能走路，开车约 10–15 分钟（估）。寺的开放时间我没查到准确的，现场确认；不要爬上遗迹，不要碰佛像"},
    {"id": "d1128-4", "t": "12:15", "n": "入住夏玛雷斯登斯（大城）", "ne": "Check-in · Syama Residence & Café", "en": "Syama Residence and Café Ayutthaya", "lat": 14.3517, "lon": 100.56, "s": "fixed", "d": "特大床房，只住 1 晚；入住 14:00 起。地址：U Thong 路 5 号，走 1 分钟就到历史公园。中午 12 点多到，大概率还进不了房", "tip": "先问能不能提前入住；不行就寄存行李，顺便问前台两件事：① 附近哪家租泰服（走路能到的）；② 能不能帮忙打电话订今晚的 Baan Ta Koh Rai（只说泰语，+66 89 764 5119）。前台 9:00–18:00，晚于 18:00 到要提前联系酒店；这家酒店不提供机场接送", "tt": "约 10–15 分钟 · 包车（估）"},
    {"id": "d1128-3", "t": "12:45", "n": "午饭（酒店附近）", "ne": "Lunch near the hotel", "s": "idea", "d": "米其林指南列的大城必比登里有 Pranom 鸡丝面（Pranom Shredded Chicken Noodles）和 Pa Lek 船面（Pa Lek Boat Noodles，明天中午吃）；今天先吃鸡丝面，或者问前台酒店附近哪家好", "tip": "这两家的地址和今天是否营业我没核实，出发前在地图搜名字，选离酒店近的；别吃太饱，下午要走路", "tt": "约 5 分钟 · 步行 / 打车（估）"},
    {"id": "d1128-9", "t": "14:00", "n": "租泰服（酒店附近）", "ne": "Rent a Thai Costume Near the Hotel", "s": "idea", "d": "酒店走 1 分钟到历史公园，但我没查到玛哈泰寺附近有名有姓的租衣店。查到有名字有价格的店都集中在柴瓦塔那兰寺门口（泰文网帖，价格是网友 2023–2024 年写的，仅供参考）：ร้านไอยรา（Aiyara）约 300 泰铢起；มณฑิตาชุดไทย、ภูษา ผ้าไทย、อโยธยา 约 200 起；化妆、做头发各约 50，带头饰整套约 500。\n办法 A（推荐）：问酒店前台，走路能到的最近一家，现场挑。\n办法 B（保底）：上午在柴瓦塔那兰寺停车时就租好，穿着拍寺、坐车去酒店，下午继续逛，再打车回去还（要问清几点前还、押金、能不能存包）。", "tip": "租之前问清：租几小时、含不含头饰首饰 / 妆发 / 摄影师、几点前要还（今天日落约 17:40，想拍湖边日落就要租到 18:00）、押金、能不能存包；鞋子选好走的"},

/* 两点间交通时间估算：直线距离 × 1.3，≤1.2 km 当步行，否则按打车 / 嘟嘟车 */
function legText(a, b){
  if (!a || !b || a.lat == null || b.lat == null || a.nov || b.nov || a.fl != null || b.fl != null) return "";
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLa = rad(b.lat - a.lat), dLo = rad(b.lon - a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo/2)**2;
  const km = 2 * R * Math.asin(Math.sqrt(h)) * 1.3;
  if (km < 0.15) return "";
  const kmS = km < 10 ? km.toFixed(1) : Math.round(km);
  if (km <= 1.2) return `约 ${Math.max(2, Math.round(km / 4.5 * 60))} 分钟 · 步行（约 ${kmS} km）`;
  const sp = km > 25 ? 50 : 25;
  return `约 ${Math.round(km / sp * 60 + 5)} 分钟 · 打车 / 嘟嘟车（约 ${kmS} km）`;

  "Chin Mee Chin",
  "这类咖啡饼店是海南人的传统：海南移民早年在英国人家里做厨师和管家，学会了西式烘焙，后来自己开咖啡店，所以才有咖椰吐司、奶油角和蛋糕。加东（Katong）以前临海，是土生华人和欧亚混血家庭聚居的地方。",
  "Confectionery cafés like this are a Hainanese tradition: Hainanese immigrants worked as cooks and butlers in British households, learned Western baking, and later opened coffee shops – hence kaya toast, cream horns and cakes. Katong was once seaside land where Peranakan and Eurasian families lived."
 ],
 [
  "Koon Seng",
  "如切（Joo Chiat）得名于地主 Chew Joo Chiat（1857–1926）。Koon Seng Road 这排彩色联排屋是 20 世纪初到战前的建筑，保留了典型的娘惹元素：灰泥花饰、彩色花砖、双开木门（pintu pagar）和前面的“五脚基”走廊。",
  "Joo Chiat is named after landowner Chew Joo Chiat (1857–1926). The pastel terrace houses on Koon Seng Road date from the early 20th century to before the war and keep classic Peranakan features: plaster ornament, coloured tiles, double swing doors (pintu pagar) and the covered \"five-foot way\"."
 ],
 [
  "Peranakan Mansion",
  "Peranakan 指早年到东南亚经商的华人与当地女子通婚后留下的后代：男性叫 Baba（峇峇），女性叫 Nyonya（娘惹），说混合了闽南语的马来语。这座博物馆在一栋 1928 年的店屋里，展出家具、布料、瓷器和首饰，能看到中国、马来和欧洲三种风格混在一起。",
  "\"Peranakan\" refers to the descendants of early Chinese traders who married local women in Southeast Asia: men are called Baba, women Nyonya, and they spoke a Malay mixed with Hokkien. This museum is in a 1928 shophouse and shows furniture, textiles, porcelain and jewellery that blend Chinese, Malay and European styles."
 ],
 [
  "老机场路食阁",
  "老机场路因旧的加冷机场（Kallang Airport）得名：1937 年启用，是新加坡第一个民用机场，1955 年被巴耶利巴机场取代。食阁（hawker centre）是 1970 年代政府把路边小贩迁进统一场所的产物，这里 1973 年开始营业。2020 年，新加坡的小贩文化被列入联合国教科文组织人类非物质文化遗产名录。",
  "Old Airport Road is named after Kallang Airport, Singapore's first civil airport (opened 1937, replaced by Paya Lebar in 1955). Hawker centres were built in the 1970s to move street hawkers into proper premises; this one opened in 1973. In 2020 Singapore's hawker culture was inscribed on UNESCO's Intangible Cultural Heritage list."
 ],
 [
  "榴莲街",
  "新加坡人叫榴莲“水果之王”，本地卖的榴莲多数从马来西亚进口。Geylang（芽笼）这个名字一般认为和这一带早年种香茅（serai）有关，旁边的 Geylang Serai 至今是马来社区的中心。老说法：榴莲“热气”，吃完要配“凉”的山竹；酒店和地铁都禁止带榴莲。",
  "Singaporeans call durian the \"king of fruits\"; most of it is imported from Malaysia. \"Geylang\" is generally thought to relate to the lemongrass (serai) once grown here, and neighbouring Geylang Serai is still the heart of the Malay community. Folk wisdom says durian is \"heaty\" and should be balanced with \"cooling\" mangosteen. Durian is banned in hotels and on the MRT."
 ],
 [
  "哈芝巷",
  "甘榜格南（Kampong Glam）曾是马来王室区：1819 年莱佛士与胡先苏丹订约，1822 年的城市规划把这一片划给苏丹和族人居住；“Gelam”据说来自一种白千层树，树皮曾用来堵船缝。后来这里成了阿拉伯商人和穆斯林朝圣者聚居的地方。哈芝巷（Haji Lane）是区里最窄的一条小巷，两边是 20 世纪初的联排店屋，早年是阿拉伯、马来商人的杂货铺和小旅馆；名字常被认为和去麦加朝圣的“哈芝”（haji）有关，说法不一。现在多是设计小店、古着和壁画。",
  "Kampong Glam was once the Malay royal quarter: Raffles signed a treaty with Sultan Hussein in 1819, and the 1822 town plan set this area aside for the Sultan and his people. \"Gelam\" is said to come from a tree whose bark was used to caulk boats. It later became home to Arab merchants and Muslim pilgrims. Haji Lane is its narrowest alley, lined with early-20th-century shophouses that were once Arab and Malay grocers and lodgings; the name is often linked to the \"haji\" who made the pilgrimage to Mecca, though accounts differ. Today it is full of design shops, vintage stores and murals."
 ],
 [
  "Bussorah",
  "Bussorah Street 的名字来自伊拉克的巴士拉（Basra），与阿拉伯商人的渊源有关。苏丹回教堂（Masjid Sultan）现在的建筑 1932 年完工，由建筑师 Denis Santry 设计；金色圆顶的底部据说嵌着穷穆斯林捐出的玻璃瓶底。",
  "Bussorah Street is named after Basra in Iraq, reflecting the Arab merchants who lived here. The present Sultan Mosque (Masjid Sultan) was completed in 1932 to a design by architect Denis Santry; the base of its golden dome is said to be studded with glass bottle ends donated by poor Muslims."
 ],
 [
  "Selegie",
  "Selegie Arts Centre 的大楼原本是一家印度咖啡店，楼上住人；1994 年被列为保护建筑，后来由国家艺术理事会改成艺术空间，1996 年 11 月启用，最早供新加坡摄影学会使用。外墙鲜艳的配色是它的标志。",
  "The Selegie Arts Centre building was originally an Indian coffee shop with homes upstairs. It was gazetted for conservation in 1994, then taken over by the National Arts Council as an arts space and opened in November 1996, first for the Photographic Society of Singapore. Its bright paint scheme is its signature."
 ],
 [
  "翡翠山历史保护区",
  "Emerald Hill 一带原是 19 世纪的肉豆蔻种植园，Cuppage Road 的名字据记载来自当年的种植园主 William Cuppage。20 世纪初，富有的土生华人在山上盖起一排排联排洋楼，1989 年被划为保护区。路口的 Peranakan Place 是这一带最显眼的一组。",
  "Emerald Hill was a 19th-century nutmeg plantation; Cuppage Road is recorded as named after planter William Cuppage. In the early 20th century wealthy Peranakans built rows of terrace houses on the hill, and the area was gazetted for conservation in 1989. Peranakan Place at the entrance is the most eye-catching group."
 ],
 [
  "National Kitchen",
  "这家餐厅所在的国家美术馆由两栋建筑合并而成：1929 年建成的旧市政厅（City Hall）和 1939 年建成的旧最高法院，2015 年改成美术馆。1945 年 9 月，日军在市政厅的大厅向盟军正式投降。餐厅的 Violet Oon 是新加坡美食作家，以娘惹菜闻名。",
  "The National Gallery is made of two merged buildings: the old City Hall (completed 1929) and the old Supreme Court (1939), converted into a gallery in 2015. In September 1945 the Japanese formally surrendered to the Allies in City Hall's chamber. Violet Oon is a Singaporean food writer known for Peranakan cuisine."
 ],
 [
  "Old Hill Street",
  "Old Hill Street Police Station 1934 年建成，曾是警察总部，在当时是新加坡最大的政府大楼之一。立面上九百多扇窗被涂成彩虹色，现在是政府部门的办公楼，只能在外面拍照。",
  "Old Hill Street Police Station was completed in 1934 and served as police headquarters; at the time it was one of Singapore's largest government buildings. Its 900-odd windows were painted in rainbow colours. It now houses government offices, so it is photographed from outside only."
 ],
 [
  "福康宁公园",
  "福康宁山（Fort Canning）古称“禁山”（Bukit Larangan），传说 14 世纪的马来王曾居住于此。1822 年莱佛士在山顶盖了住所，还开辟了新加坡第一个实验植物园；1859 年建炮台，以印度总督坎宁子爵命名。1942 年二战时，山下“Battle Box”地下指挥部是英军决定投降的地方。",
  "Fort Canning, once called \"Forbidden Hill\" (Bukit Larangan), is said to have been home to a 14th-century Malay king. In 1822 Raffles built a residence on top and started Singapore's first experimental botanic garden; the fort (1859) is named after Viscount Canning, Governor-General of India. In 1942 the \"Battle Box\" bunker beneath the hill was where the British decided to surrender."
 ],
 [
  "土生华人博物馆",
  "博物馆所在的大楼 20 世纪初是道南学校（Tao Nan School），新加坡最早的华文学校之一，由福建人创办。博物馆 2023 年改造后重新开放，收藏峇峇娘惹的婚礼、服饰、珠绣和金饰，很多物件把中国的图案、马来的做法和欧洲的瓷器混在一起。",
  "The building was the Tao Nan School in the early 20th century, among Singapore's earliest Chinese-language schools, founded by the Hokkien community. The museum reopened in 2023 after a revamp, with Peranakan weddings, clothing, beadwork and gold jewellery – many pieces mix Chinese motifs, Malay craft and European porcelain."
 ],
 [
  "HolyCrab",
  "HolyCrab 所在的 Capitol Singapore，老 Capitol 戏院 1930 年开幕，是装饰艺术风格的老戏院，2015 年修复后改成商场和酒店。吃螃蟹戴一次性手套直接手抓，是本地人的吃法。",
  "Capitol Singapore's old Capitol Theatre opened in 1930, an Art Deco cinema restored in 2015 as a mall and hotel. Eating crab with disposable gloves and bare hands is the local way."
 ],
 [
  "国家博物馆",
  "新加坡最老的博物馆，前身是 1849 年的莱佛士图书馆与博物馆；现在的新古典主义建筑和圆顶 1887 年落成，1965 年改称国家博物馆。展厅从渔村讲到港口城市，包括日据时期的展览。",
  "Singapore's oldest museum, descended from the Raffles Library and Museum of 1849. The present neoclassical building and dome were completed in 1887, and it was renamed the National Museum in 1965. The galleries trace Singapore from fishing village to port city, including the Japanese Occupation."
 ],
 [
  "Kopi House",
  "“Kopi”是马来语“咖啡”，tiam 是福建话“店”，kopitiam 就是咖啡店。点单暗语：Kopi = 加炼乳和糖；Kopi O = 黑咖啡加糖；Kopi C = 加淡奶和糖；Kopi Kosong = 有奶无糖；Kopi O Kosong = 黑咖啡不加糖；Siew Dai = 少糖；Gao = 浓；Po = 淡。",
  "\"Kopi\" is Malay for coffee and \"tiam\" is Hokkien for shop, so kopitiam = coffee shop. Order code: Kopi = with condensed milk and sugar; Kopi O = black with sugar; Kopi C = with evaporated milk and sugar; Kopi Kosong = with milk, no sugar; Kopi O Kosong = black, no sugar; Siew Dai = less sugar; Gao = strong; Po = weak."
 ],
 [
  "Night Safari",
  "夜间动物园 1994 年开放，是世界上第一个夜间动物园，里面以夜行动物为主，用低亮度的灯光模拟月光。园内禁止闪光灯，会打扰动物。",
  "Night Safari opened in 1994 as the world's first nocturnal zoo, focused on night-active animals under low lighting that imitates moonlight. Flash photography is forbidden because it disturbs the animals."
 ],
 [
  "Tong Ah",
  "东亚餐室（Tong Ah Eating House）1939 年开在 Keong Saik Road，以炭烤吐司和半熟蛋出名。Keong Saik Road 在 20 世纪前半叶是红灯区，后来整条街的店屋被翻新，变成精品酒店和餐厅。",
  "Tong Ah Eating House opened in 1939 on Keong Saik Road and is known for charcoal-grilled toast with soft-boiled eggs. Keong Saik Road was a red-light district in the first half of the 20th century; its shophouses were later restored as boutique hotels and restaurants."
 ],
 [
  "Tong Mern Sern",
  "Tong Mern Sern 所在的 Craig Road 属于丹绒巴葛（Tanjong Pagar）保护区。店屋（shophouse）是新加坡最典型的老建筑：楼下做生意、楼上住人，前面有顶的“五脚基”（five-foot way）是莱佛士 1822 年城市规划规定的遮阳避雨走廊。",
  "Craig Road lies in the Tanjong Pagar Conservation Area. The shophouse is Singapore's classic old building: shop downstairs, home upstairs, with a covered \"five-foot way\" in front that Raffles' 1822 town plan required as shelter from sun and rain."
 ],
 [
  "BabyFang",
  "Tras Link 一带属于丹绒巴葛。“Tanjong Pagar”在马来语里大意是“木桩岬”，据说和早年沿岸插着捕鱼的木桩有关。",
  "Tras Link is in Tanjong Pagar. \"Tanjong Pagar\" is Malay for roughly \"cape of stakes\", said to refer to the fishing stakes once planted along the shore."
 ],
 [
  "佛牙寺",
  "佛牙寺 2007 年开放，仿唐代风格，供奉一枚被寺方称为佛牙舍利的圣物，据寺方说是 1980 年前后在缅甸一座倒塌的佛塔中发现的。进寺要遮住肩膀和膝盖。",
  "The Buddha Tooth Relic Temple opened in 2007 in Tang-dynasty style and enshrines a relic the temple describes as a tooth of the Buddha, which it says was found around 1980 in a collapsed stupa in Myanmar. Cover shoulders and knees to enter."
 ],
 [
  "Tai Chong Kok",
  "Sago Street（西米街）得名于以前这一带的西米（sago）加工厂。Sago Lane 的老名字叫“死人街”：20 世纪上半叶，街上有给临终老人住的“死人屋”，如今早已拆掉。",
  "Sago Street is named after the sago-flour mills that once stood here. Sago Lane's old nickname was \"Street of the Dead\": in the first half of the 20th century it had \"death houses\" where the dying elderly stayed; they were long ago demolished."
 ],
 [
  "Chinatown Market Wall",
  "这组壁画的作者 Yip Yew Chong（叶耀聪）是新加坡艺术家，用怀旧的画风把老牛车水的日常——菜市场、理发摊、木屐匠——画在店屋外墙上，让人站进画面里拍照。牛车水的名字来自马来语 Kreta Ayer，意思是“水车”——早年这一带没有自来水，用牛车运水来卖。1822 年莱佛士的城市规划把新加坡河南岸划给华人居住，牛车水逐渐成为华人社区的中心。",
  "The mural's artist, Yip Yew Chong, is a Singaporean who paints nostalgic scenes of old Chinatown – wet markets, barbers, clog makers – on shophouse walls so visitors can step into the picture. Chinatown's Chinese name \"Niu Che Shui\" comes from the Malay Kreta Ayer, \"water cart\": early residents had no tap water, so water was hauled in by ox cart. Raffles' 1822 plan set the south bank of the river aside for the Chinese."
 ],
 [
  "鱼尾狮",
  "鱼尾狮是 1964 年为新加坡旅游局设计的标志，设计者是 Alec Fraser-Brunner。狮头来自“Singapura（狮城）”的传说——14 世纪的王子 Sang Nila Utama 在岛上见到一头狮子；鱼身代表这里原本是叫 Temasek（淡马锡）的渔村。公园里的石像 1972 年由李光耀揭幕，2002 年迁到现在的位置。",
  "The Merlion was created in 1964 as a logo for the Singapore Tourism Board by Alec Fraser-Brunner. The lion head comes from the legend of \"Singapura\" (Lion City), when the 14th-century prince Sang Nila Utama saw a lion on the island; the fish body recalls the fishing village of Temasek. The statue was unveiled by Lee Kuan Yew in 1972 and moved to its present spot in 2002."
 ],
 [
  "滨海湾花园",
  "滨海湾花园 2012 年开放，建在填海土地上，是新加坡“花园中的城市”政策的代表作。擎天大树（Supertree）高 25–50 米，表面爬满植物，顶上装着太阳能板，有的还负责给旁边的温室排气降温。OCBC 空中走廊离地约 22 米。",
  "Gardens by the Bay opened in 2012 on reclaimed land and is the flagship of Singapore's \"City in a Garden\" vision. The Supertrees stand 25–50 m tall, covered in plants, topped with solar panels, and some vent the greenhouses' cooling system. The OCBC Skyway is about 22 m above ground."
 ],
 [
  "Garden Rhapsody",
  "Garden Rhapsody 是在 Supertree Grove 每晚固定场次的灯光音乐秀，灯光随着音乐变化，每场十几分钟。可以躺在草地或空地上仰头看。",
  "Garden Rhapsody is a nightly light-and-music show at the Supertree Grove, lasting a dozen minutes or so. Lie on the grass or open ground and look up."
 ],
 [
  "Bafu",
  "榴莲鸡锅是近年在新加坡和马来西亚流行起来的吃法：把榴莲果肉煮进鸡汤，汤带着榴莲的甜和奶香。冷知识：滨海艺术中心（Esplanade）圆圆带刺的屋顶，本地人叫它“大榴莲”。",
  "Durian chicken pot is a recent Singapore–Malaysia craze: durian flesh simmered into chicken soup for sweetness and creaminess. Trivia: the round, spiky roof of the Esplanade theatres is nicknamed \"the durian\" by locals."
 ],
 [
  "雨漩涡",
  "星耀樟宜（Jewel）2019 年 4 月开放，由 Safdie Architects 设计，盖在 T1 前面原来的露天停车场上。40 米高的 HSBC 雨漩涡（Rain Vortex）常被称为世界最高的室内瀑布，旁边的森林谷种满了树木和灌木。",
  "Jewel Changi Airport opened in April 2019, designed by Safdie Architects, on the former open-air car park in front of T1. The 40 m HSBC Rain Vortex is often called the world's tallest indoor waterfall, and the Forest Valley beside it is planted with trees and shrubs."
 ],
 [
  "抵达曼谷素万那普",
  "素万那普机场 2006 年 9 月启用，取代廊曼机场成为曼谷的主要国际机场。“Suvarnabhumi”是泰语“黄金之地”，由已故的普密蓬国王赐名。",
  "Suvarnabhumi Airport opened in September 2006 and replaced Don Mueang as Bangkok's main international airport. \"Suvarnabhumi\" means \"Golden Land\" in Thai and was named by the late King Bhumibol."
 ],
 [
  "安凡尼",
  "酒店在湄南河（Chao Phraya）边，这条河常被译为“王者之河”，是曼谷的命脉：18 世纪末曼谷建都时，城市就沿着河发展，河上的渡船和长尾船至今还在运人。",
  "The hotel sits on the Chao Phraya, often translated \"River of Kings\", Bangkok's lifeline. When the city was founded in the late 18th century it grew along the river, and ferries and long-tail boats still carry people today."
 ],
 [
  "ICONSIAM",
  "ICONSIAM 2018 年底在湄南河边开业，是曼谷的大型滨水商场。里面的 SOOKSIAM 是室内水上市场，仿造泰国各地的传统市场和水上生活，可以集中吃到各地小吃。",
  "ICONSIAM opened on the Chao Phraya in late 2018, a large riverside mall. Its SOOKSIAM indoor floating market recreates traditional markets and water life from across Thailand, with regional snacks in one place."
 ],
 [
  "丹嫩沙多",
  "丹嫩沙多运河是拉玛四世（Mongkut）在 1866 年下令开凿的，用来连通 Tha Chin 河与 Mae Klong 河。以前的水上市场是当地人买卖的日常，现在以游客为主，早上 9 点前人少一些。",
  "The Damnoen Saduak canal was ordered dug by King Rama IV (Mongkut) in 1866 to link the Tha Chin and Mae Klong rivers. The floating market was once everyday trade for locals and is now mostly for visitors; it is quieter before 9 a.m."
 ],
 [
  "美功铁道",
  "美功铁路市场（Talat Rom Hoop，“收伞市场”）的小贩把摊子搭在铁轨上，火车来时才收起遮阳棚让路，车过之后再支起。这条美功铁路是 20 世纪初的老铁路。",
  "At the Maeklong Railway Market (Talat Rom Hoop, \"umbrella-folding market\") vendors set up on the tracks and fold away their awnings only when a train comes, then reopen as it passes. The line is an early-20th-century railway."
 ],
 [
  "班印轩",
  "安帕瓦（Amphawa）是泰国国王拉玛二世的出生地，运河边保留着不少木屋。住在这里的好处是傍晚游客散去后，运河一带很安静，早晨能看到水边的日常生活。",
  "Amphawa is the birthplace of King Rama II, and canal-side wooden houses still stand. Staying here means the canal turns quiet after day visitors leave, and you can see everyday waterside life in the morning."
 ],
 [
  "安帕瓦水上市场",
  "安帕瓦水上市场只在周五到周日的下午和晚上热闹，小贩在船上烧烤海鲜、卖糕点。安帕瓦本身是个有两百多年历史的运河小镇，拉玛二世（1767–1824）出生在这里。",
  "Amphawa Floating Market is busy only on Friday to Sunday afternoons and evenings, with vendors grilling seafood and selling sweets from boats. Amphawa itself is a canal town over two centuries old and the birthplace of Rama II (1767–1824)."
 ],
 [
  "萤火虫",
  "安帕瓦运河边长着一种叫 lamphu 的植物（海桑），夜里成群的萤火虫停在树上一起闪光。萤火虫怕光和噪音，船上请关闪光灯、手电和手机屏幕；月亮太亮的夜晚看得少。",
  "Fireflies gather on lamphu trees (mangrove apple) along Amphawa's canals and flash together at night. They are sensitive to light and noise, so turn off flash, torches and phone screens on the boat; bright moonlit nights show fewer."
 ],
 [
  "河边散步",
  "湄南河在泰国人心里是母亲河，古时的城市和皇宫都沿河而建。清晨河边是看当地生活的好时间：渡船、早市和给僧人布施的人。",
  "The Chao Phraya is Thailand's mother river; old cities and palaces were built along it. Early morning on the riverbank is a good time to see local life: ferries, morning markets and people giving alms to monks."
 ],
 [
  "入住诺富特",
  "暹罗（Siam）是泰国 1939 年之前的国名，1939 年改名 Thailand，1945–1949 年又短暂改回 Siam。“暹罗广场”一带因此得名，是曼谷最热闹的商圈。",
  "Siam was Thailand's name until 1939, when it became Thailand; it briefly reverted to Siam in 1945–1949. Siam Square is named from this and is Bangkok's busiest shopping district."
 ],
 [
  "恰图恰",
  "恰图恰周末市场的前身 1940 年代在别处开设，1982 年搬到现址，现在有一万五千个左右的摊位，分成二十七个区。名字来自旁边的恰图恰公园。",
  "Chatuchak Weekend Market began elsewhere in the 1940s and moved to its present site in 1982. It now has around 15,000 stalls in 27 sections, and is named after the neighbouring Chatuchak Park."
 ],
 [
  "暹罗商圈",
  "Siam Square 一带的商业街区兴起于 1960 年代，土地属于朱拉隆功大学，是曼谷最早规划的商圈之一，周围商场、电影院和年轻人的小店很集中。",
  "The Siam Square area developed in the 1960s on Chulalongkorn University land and is one of Bangkok's earliest planned commercial districts, with malls, cinemas and young designers' shops close together."
 ],
 [
  "大皇宫",
  "大皇宫 1782 年由拉玛一世建造，当年他把首都从湄南河西岸的吞武里迁到东岸的 Rattanakosin。玉佛寺（Wat Phra Kaew）供着用整块翠玉雕成的玉佛，国王每年换三次衣服，对应热季、雨季、凉季。进去要遮住肩膀和膝盖。",
  "The Grand Palace was built in 1782 by Rama I when he moved the capital from Thonburi on the west bank to Rattanakosin on the east. Wat Phra Kaew houses the Emerald Buddha, carved from a single piece of jade; the king changes its robes three times a year for the hot, rainy and cool seasons. Shoulders and knees must be covered."
 ],
 [
  "卧佛寺",
  "Wat Pho 比曼谷建都还早，是曼谷最古老的佛寺之一，卧佛长约 46 米，佛脚底镶着 108 个吉祥图案，用珍珠母贝嵌成。这里也是泰式按摩学校的发源地，寺里有刻着穴位和草药的石碑。",
  "Wat Pho predates Bangkok itself and is among its oldest temples. The Reclining Buddha is about 46 m long, with 108 auspicious symbols inlaid in mother-of-pearl on the soles. It is also the birthplace of the Thai massage school, with stone tablets showing pressure points and herbs."
 ],
 [
  "郑王庙",
  "郑王庙（Wat Arun）意为“黎明寺”，名字取自印度的黎明神 Aruna。中央的大塔（prang）高约 70–80 米，用瓷片和贝壳贴成花纹，据说那些瓷片是早年中国商船压舱的碎瓷器。登塔的台阶很陡。",
  "Wat Arun means \"Temple of Dawn\", after the Indian dawn god Aruna. The central prang, roughly 70–80 m high, is decorated with porcelain and shell – said to be broken porcelain from Chinese ships' ballast. The steps are steep."
 ],
 [
  "耀华力",
  "耀华力路（Yaowarat）是曼谷唐人街的主街，华人在 1782 年曼谷建都时被迁到这一带，这条路本身是拉玛五世时期、19 世纪末修的。这里的华人以潮州人为主，夜里整条街摆满小吃摊。",
  "Yaowarat is the main street of Bangkok's Chinatown. Chinese merchants were moved here when Bangkok was founded in 1782, and the road itself dates from Rama V's reign in the late 19th century. The community is largely Teochew, and at night the whole street fills with food stalls."
 ],
 [
  "Big C",
  "Ratchadamri（拉差达姆里）大意是“王室行进之路”，这条路从暹罗商圈通向王室所在的 Dusit 一带。",
  "Ratchadamri means roughly \"royal progress\"; the road runs from the Siam area toward the Dusit district where the royal family lives."
 ],
 [
  "Jewel 到达",
  "樟宜机场多次被评为世界最佳机场之一。T1 是最早的航站楼，1981 年启用；Jewel 就盖在它前面，两者有连廊相通。",
  "Changi Airport is repeatedly ranked among the world's best. Terminal 1, the oldest, opened in 1981; Jewel was built in front of it and is linked by a walkway."
 ],
 [
  "田鸡粥",
  "田鸡粥里的“田鸡”其实是青蛙：把青蛙肉和砂锅粥一起煮，可以做成姜葱、宫保、白胡椒等口味，是新加坡人的经典宵夜。通宵营业的田鸡粥店集中在芽笼（Geylang）一带。",
  "The \"field chicken\" in this porridge is frog. Frog meat is cooked with claypot porridge in ginger-and-spring-onion, kung pao, white pepper and other styles – a classic Singaporean supper. Late-night frog porridge shops cluster in Geylang."
 ],
 [
  "Asiatique",
  "Asiatique 这片河边场地原是丹麦东亚公司（East Asiatic Company）的码头和仓库，改造成夜市和购物区后，2012 年开业。仓库式的白色长廊、河边餐厅和摩天轮，是曼谷最容易逛的夜市之一。",
  "The Asiatique riverfront site was once the wharf and warehouses of Denmark's East Asiatic Company; after conversion into a night market and shopping area it opened in 2012. White warehouse-style arcades, riverside restaurants and a Ferris wheel make it one of Bangkok's easiest night markets to stroll."
 ],
 [
  "天福宫",
  "天福宫（Thian Hock Keng）最早是 1821–22 年的一间小庙，供奉妈祖（航海人的保护神）；1839–1842 年由陈笃生出资重建，1973 年列为国家古迹。早年海岸线就在庙门口，刚下船的福建移民会先来这里拜谢平安到岸。",
  "Thian Hock Keng began as a small joss house in 1821–22 dedicated to Mazu, protector of seafarers; it was rebuilt in 1839–1842 with funds from Tan Tock Seng and gazetted a national monument in 1973. The shoreline once lay right at its door, and newly arrived Hokkien immigrants came here to give thanks for a safe voyage."
 ],
 [
  "Maxwell",
  "麦士威熟食中心在牛车水边上。海南鸡饭源自海南的文昌鸡，被新加坡人视为最有代表性的国民菜之一；天天海南鸡饭（Tian Tian）是这里排队最长的一家，必比登推介。",
  "Maxwell Food Centre sits on the edge of Chinatown. Hainanese chicken rice descends from Hainan's Wenchang chicken and is widely regarded as one of Singapore's signature dishes; Tian Tian is the longest queue here and a Michelin Bib Gourmand."
 ],
 [
  "树抱佛庙",
  "Wat Bang Kung 在夜功府（Samut Songkhram）的 Bang Khon Thi 一带，大殿（ubosot）被一棵大榕树的根完全包裹，树根、墙和佛像长在一起，所以叫“树抱佛庙”，是安帕瓦周边最出名的小景点之一。建寺年代各来源说法不一，这里不写。",
  "Wat Bang Kung is in Bang Khon Thi, Samut Songkhram Province. Its ubosot (ordination hall) is completely wrapped in the roots of a huge banyan tree, so walls, roots and Buddha images have grown together – hence the nickname \"the temple embraced by a tree\". It is one of the best-known small sights around Amphawa. Sources disagree on its founding date, so none is given here."
 ],
 [
  "布施",
  "托钵（tak bat）是泰国南传佛教的日常：僧侣清晨出门化缘，信众把米饭、食物或日用品放进钵里，作功德。安帕瓦、美功一带水网多，有的僧侣会划小船沿运河接受供养。女性不要直接触碰僧人，递东西时放进钵里或放在布上。",
  "Tak bat – the morning alms round – is part of daily life in Thai Theravada Buddhism: monks walk (or, along canals like Amphawa's, paddle) out at dawn and people place rice, food or daily necessities in their bowls to make merit. Women should not touch monks directly; put offerings in the bowl or on a cloth."
 ],
 [
  "租泰服",
  "近年来穿泰服（Chut Thai）去古迹和寺庙拍照很流行，泰国本地人自己也爱这样玩。寺庙毕竟是宗教场所，衣服要得体，别爬遗迹、别摆不敬的姿势。",
  "Wearing Chut Thai (traditional Thai dress) for photos at ruins and temples has become very popular in recent years, including among Thais themselves. Temples are still sacred places: dress modestly, don't climb on the ruins and avoid disrespectful poses."
 ],
 [
  "Here Hai",
  "Here Hai 在曼谷 Ekkamai 路，据 2024 年的探店文章，主打蟹肉炒饭和蟹肉蛋卷，是米其林必比登小店。",
  "Here Hai is on Ekkamai Road in Bangkok; according to a 2024 review it is known for crab fried rice and crab omelette, and is a Michelin Bib Gourmand listing."
 ],
 [
  "汤普森",
  "吉姆·汤普森（Jim Thompson）是美国人，二战后帮泰丝重新打开国际市场。1967 年他在马来西亚金马伦高原散步时失踪，至今没有定论。故居由几座传统柚木房屋拆迁、重新组合而成。",
  "Jim Thompson was an American who helped revive the Thai silk industry and open it to international markets after WWII. In 1967 he vanished while walking in Malaysia's Cameron Highlands and his fate remains unresolved. The house is assembled from several traditional teak houses that were dismantled and rebuilt here."
 ],
 [
  "朱拉隆功夜市",
  "朱拉隆功大学 1917 年创办，是泰国第一所大学，以拉玛五世朱拉隆功（Chulalongkorn）命名。校门口这条 Bhantat Thong 路一带平价小吃集中。",
  "Chulalongkorn University was founded in 1917 as Thailand's first university and named after King Rama V (Chulalongkorn). Bhantat Thong Road by the campus is packed with cheap street food."
 ],
 [
  "水门市场",
  "Pratunam 泰语意为“水门”，据说得名于这一带运河上的水闸。现在是曼谷最大的成衣批发区之一。",
  "Pratunam means \"water gate\" in Thai, said to refer to a lock on the nearby canal. Today it is one of Bangkok's biggest garment wholesale districts."
 ],
 [
  "水门寺",
  "水门寺（Wat Paknam Bhasicharoen）在吞武里一侧，以已故住持 Luang Pu Sod（Phra Mongkol Thepmuni）和他传授的法身禅（Dhammakaya）闻名。现在的 80 米白塔（2012 年建）顶层有一座绿色玻璃小佛塔，天花板画着蓝紫色星河；院里的 69 米青铜坐佛 2021 年完工（数据来自一个旅游网站，没有逐条核实）。",
  "Wat Paknam Bhasicharoen, on the Thonburi side, is known for its late abbot Luang Pu Sod (Phra Mongkol Thepmuni) and the Dhammakaya meditation he taught. The 80 m white stupa (2012) holds a small green glass pagoda on its top floor under a ceiling painted with blue-violet galaxies; the 69 m bronze seated Buddha in the compound was completed in 2021 (figures from a travel site, not individually verified)."
 ],
 [
  "夏玛雷斯登斯",
  "大城（Ayutthaya）传统说法建于 1350 年前后，由乌通王（Ramathibodi 一世）在湄南河、华富里河、巴萨河交汇处的一座岛上建城，四面环水，所以后人叫它“东方威尼斯”。此后约 417 年里，大城是暹罗的首都，历经 30 多位国王，是东南亚最繁华的港口之一，来自中国、日本、波斯、葡萄牙、荷兰、法国的商人都在城外设有聚居区。1767 年缅甸军队攻破大城，烧毁王宫、寺庙和大部分档案，国王殿下的朝廷南迁，后来才建起吞武里、曼谷。现在的“古迹”大多是那次浩劫后的断壁残垣；这片遗址 1991 年列入联合国教科文组织世界遗产。",
  "Ayutthaya is traditionally dated to about 1350, when King U Thong (Ramathibodi I) founded it on an island where three rivers meet — hence the nickname 'Venice of the East'. For roughly 417 years it was Siam's capital and one of Southeast Asia's busiest ports, with foreign quarters for Chinese, Japanese, Persian, Portuguese, Dutch and French traders. Burmese forces sacked it in 1767, burning palaces, temples and most records; the court later moved to Thonburi and then Bangkok. The ruins you see are what survived; the site became a UNESCO World Heritage Site in 1991."
 ],
 [
  "柴瓦塔那兰寺",
  "Wat Chaiwatthanaram 是国王 Prasat Thong 在 1630 年前后建的王家寺院，建在湄南河西岸，据说是为纪念他母亲的住处、积功德，也有学者认为是为庆祝战胜柬埔寨的 Longvek（说法不一）。建造可能花了约 20 年。高棉风格：中央主塔约 35 米，象征须弥山，四周四座小塔，八座佛塔形小殿用回廊相连。1767 年缅甸军队攻城时，这里被占作据点，后来被废弃约 220 年，佛像被砍头、砖被偷。1987 年泰国艺术厅开始修复，1992 年对外开放；2011 年大水把寺淹没，之后又花了约 2 亿泰铢整修。",
  "Wat Chaiwatthanaram was built around 1630 by King Prasat Thong on the west bank of the Chao Phraya, said to honour his mother's former residence and to gain merit (some scholars also link it to a victory over Longvek in Cambodia; accounts differ). Construction may have taken about 20 years. It is Khmer in style: a central prang of about 35 m symbolising Mount Meru, four smaller prangs, and eight chedi-shaped chapels joined by galleries. After the 1767 sack it was abandoned for about 220 years. Restoration began in 1987 and it opened to the public in 1992; the 2011 floods submerged it and a further ~200 million baht repair followed."
 ],
 [
  "玛哈泰寺",
  "Wat Mahathat（“大舍利寺”）是大城最重要的王家寺院之一，据载在 Borommaracha 一世（1370–88 年在位）和 Ramesuan 王（1388–95 年在位）时期建成，中央主塔里曾供奉佛舍利，是大城早期的宗教中心。1767 年被缅甸军队毁掉。那个被榕树根包住的佛头是这里最出名的画面：佛头怎么到树根里的，没有定论，常见说法是佛像被砍头后，头落在树旁，树根慢慢长上来包住。园里很多佛像没有头，也是那次浩劫留下的。",
  "Wat Mahathat ('Temple of the Great Relic') was one of Ayutthaya's most important royal temples, built under Borommaracha I (r. 1370–88) and Ramesuan (r. 1388–95); its central prang once held Buddha relics. Burmese forces ruined it in 1767. The Buddha head in banyan roots is its famous image; how it got there is not settled — the usual story is that a beheaded statue's head came to rest by a tree and the roots grew around it. The many headless statues are also from the sack."
 ],
 [
  "拉嘉布拉那寺",
  "Wat Ratchaburana 建于 1424 年，国王 Borommaracha 二世下令，地点是他的两位哥哥决斗身亡后火化的地方：国王去世后两个哥哥（Ai 和 Yi）骑象决斗争夺王位，双双战死，弟弟继位后在此建塔纪念。主塔下有地宫，里面有 15 世纪的壁画，德国协助修复过；据我所知 1957 年曾有盗墓者挖开地宫，偷走金器，后来追回的部分藏在 Chao Sam Phraya 国家博物馆（这一点我没核实）。",
  "Wat Ratchaburana was built in 1424 by King Borommaracha II on the site where his two elder brothers were cremated: after their father died they fought a duel on elephant-back for the throne and both were killed. The main prang has an underground crypt with 15th-century murals, stabilised with German-funded restoration. As far as I know, looters dug into the crypt in 1957 and took gold objects, some later recovered and now in the Chao Sam Phraya National Museum (not verified)."
 ],
 [
  "帕兰寺",
  "Wat Phra Ram 建在大城第一位国王 Ramathibodi 一世火化的地方。多数学者认为是他的儿子 Ramesuan 在 1369 年下令兴建，不过编年史说法不一（最早的 Luang Prasoet 编年史写 1369 年，后来的版本写 1434 年）。Borommakot 王在 1741 年修缮过。高棉式的主塔和一排排小佛塔建在叫 Bueng Phra Ram 的低洼湿地边，所以有水中倒影。1685 年法国耶稣会士 Guy Tachard 曾记下这里有五座镀金佛塔和约 44 座金字塔形建筑。",
  "Wat Phra Ram stands on the cremation site of Ayutthaya's first king, Ramathibodi I. Most scholars say his son Ramesuan ordered it built in 1369, though chronicles disagree (the oldest, Luang Prasoet, says 1369; later ones say 1434). King Borommakot restored it in 1741. The Khmer-style prang and rows of small chedis sit beside a low marshy area called Bueng Phra Ram, hence the reflections. The Jesuit Guy Tachard described five gilded domes and about 44 pyramid-shaped structures here in 1685."
 ],
 [
  "帕西桑佩寺",
  "Wat Phra Si Sanphet 是大城王宫里的御用寺院，没有常驻僧侣，只办王室仪式。传统上，这片地原是乌通王的宫殿，后来才改为寺；1492 年国王 Ramathibodi 二世在这里建塔，三座并排的钟形佛塔供奉着几位国王的骨灰。寺里原有一尊高约 16 米、包着金的大佛，1767 年被缅甸人熔掉取金。据说曼谷玉佛寺（Wat Phra Kaew）的设计受它启发。旁边的蒙科空博碧寺（Wihan Phra Mongkhon Bophit）有一尊大铜佛，我印象里佛像是 15–16 世纪的，大殿是后来重建的（没核实）。",
  "Wat Phra Si Sanphet was the royal temple inside the Ayutthaya palace compound, used for royal ceremonies rather than housing monks. The site was once the palace of King U Thong; in 1492 King Ramathibodi II built here, and the three bell-shaped chedis hold the ashes of kings. It once housed a ~16 m gold-covered Buddha which the Burmese melted down in 1767. It reportedly inspired the design of Bangkok's Wat Phra Kaew. Next door, Wihan Phra Mongkhon Bophit holds a large bronze Buddha; as I recall the image dates to the 15th–16th centuries and the hall was rebuilt later (not verified)."
 ],
 [
  "洛卡亚苏塔寺",
  "Wat Lokayasutharam 以露天大卧佛闻名，佛像约 40 多米长、8 米多高，头朝北、面朝西。建寺年代没有确切记载，从风格看是大城中期（16 世纪以后）。卧佛原来有大殿覆盖，殿塌后只剩佛身，后来用灰泥修补。佛的右手枕头、左手搭在身侧，是“涅槃”姿势，代表释迦牟尼最后的时刻。",
  "Wat Lokayasutharam is known for its open-air reclining Buddha, roughly 40-odd metres long and over 8 m high. Its date is unrecorded; the style points to the middle Ayutthaya period (after the 16th century). The Buddha was once housed in a hall; after the roof was lost only the body remained and it was later repaired in stucco. The pose represents the Buddha's final moments (parinirvana)."
 ],
 [
  "Yai Chai Mongkhon",
  "Wat Yai Chai Mongkhon 原是大城早期的禅修寺院：传说 1357 年乌通王为从斯里兰卡学成归来的僧团建的，叫 Wat Pa Kaeo（林中寺）。1592 年纳黎萱大帝（Naresuan）在象背上与缅甸王储决斗获胜，为纪念这次战役，在寺里建了高约 72 米的大佛塔，所以改名“胜利大寺”。塔周围一圈坐佛，原来被缅甸人砍头，后来用僧袍披上。🎬 这里是 86 版《西游记》第 24 集「天竺收玉兔」的取景地（剧中的布金寺），据多篇中文文章，《泰囧》也在这里拍过。（建寺和决斗的年份各来源说法不一，我没逐条核实。）",
  "Wat Yai Chai Mongkhon began as a meditation monastery: tradition says King U Thong founded it in 1357 for monks returning from study in Sri Lanka (Wat Pa Kaeo, 'forest temple'). After King Naresuan's elephant-back duel victory over the Burmese crown prince (about 1592) the large chedi, roughly 72 m, was built to commemorate it, hence the name 'Great Temple of Auspicious Victory'. Rows of seated Buddhas ring the chedi, wrapped in saffron robes. (Dates differ between sources and are not individually verified.)"
 ]
];
const loreFor = p => { if (p.nov || p.custom) return null; for (const [k,zh,en] of LORE) if ((p.n||'').includes(k)) return {zh,en}; return null; };

};
function ymdIn(tz){ return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function hmIn(tz){ return new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()); }
function mdwIn(tz){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:tz,month:"numeric",day:"numeric",weekday:"short"}).formatToParts(new Date());
  const g = t => (p.find(x => x.type === t) || {}).value;
  const wk = {Sun:"周日",Mon:"周一",Tue:"周二",Wed:"周三",Thu:"周四",Fri:"周五",Sat:"周六"}[g("weekday")];
  return g("month") + "/" + g("day") + " " + wk;
}
function dayObj(date){ const [y,m,d] = date.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); }
function fetchJSON(url, ms){
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const t = setTimeout(() => ctl && ctl.abort(), ms || 9000);
  return fetch(url, ctl ? {signal:ctl.signal} : {}).then(r => { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.json(); });
}

  const today = ymdIn("Asia/Shanghai");
  const start = "2026-11-22", last = DAYS[DAYS.length-1].date;
  let msg;
  if (today < start){
    const n = Math.round((dayObj(start) - dayObj(today)) / 86400000);
    msg = n === 1 ? "✈ 明天就出发啦！" : `✈ 距离出发还有 <b>${n}</b> 天`;
  } else if (today <= last){
    msg = `✿ 旅途第 <b>${Math.round((dayObj(today) - dayObj(start)) / 86400000) + 1}</b> 天`;
  } else msg = "旅程结束啦，记得整理照片";
  $("#countdown").innerHTML = msg;
}

const getVisit = () => store.get("visit", {});
const getExtras = date => store.get("extra:" + date, []);
function stampNow(){ const d = new Date(), z = n => String(n).padStart(2, "0"); return (d.getMonth()+1) + "/" + d.getDate() + " " + z(d.getHours()) + ":" + z(d.getMinutes()); }
function dayItemsFull(day){
  const ex = getExtras(day.date), out = [];
  const mk = x => Object.assign({s:"fixed", custom:true, t:""}, x, {en: x.en || x.ne || x.n});
  day.items.forEach(p => { out.push(p); ex.filter(x => x.after === p.id).forEach(x => out.push(mk(x))); });
  ex.filter(x => !x.after || !day.items.some(p => p.id === x.after)).forEach(x => out.push(mk(x)));
  return out;
}
const visitable = p => !p.fl && !p.nov;
function updateProgress(){
  const day = curDay(), vis = getVisit(), list = dayItemsFull(day).filter(visitable);
  const el = $("#prog"), all = dayItemsFull(day);
  if (el) el.textContent = "已打卡 " + list.filter(p => vis[p.id]).length + " / " + list.length + " · 已预约 " + all.filter(p => bookedOn(p.id)).length + " / " + all.length;
}

const sh = { me: store.get("me", "") || "我", st: null, status: "idle", lastOk: null, busy: false, again: false, t: null };
sh.st = (() => { const x = store.get("shared", null) || {}; x.notes = x.notes || {}; x.booked = x.booked || {}; return x; })();
const saveShared = () => store.set("shared", sh.st);
function mergeShared(a, b){
  const out = {notes:{}, booked:{}};
  ["notes", "booked"].forEach(k => { const m = out[k]; [a[k] || {}, b[k] || {}].forEach(src => { for (const id in src){ const x = src[id]; if (!m[id] || (x.ts || 0) > (m[id].ts || 0)) m[id] = x; } }); });
  return out;
}
(function migrateNotes(){
  if (store.get("notesMigrated", 0)) return;
  const old = store.get("notes", {});
  Object.keys(old).forEach(id => { const t = String(old[id] || "").trim(); if (!t) return; const eid = "m" + id; if (!sh.st.notes[eid]) sh.st.notes[eid] = {id:eid, item:id, by:sh.me || "我", ts:Date.now(), text:t.slice(0, 800)}; });
  store.set("notesMigrated", 1); saveShared();
})();
const fmtTs = ts => { const d = new Date(ts); return (d.getMonth()+1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const notesFor = id => Object.values(sh.st.notes).filter(n => n.item === id && !n.del).sort((a, b) => a.ts - b.ts);
const noteLine = id => notesFor(id).map(n => (n.by || "匿名") + "：" + n.text).join("；");
const bookedOn = id => !!(sh.st.booked[id] && sh.st.booked[id].v);
function bkHTML(id){
  const b = sh.st.booked[id], on = b && b.v;
  return `<button class="bkb ${on ? "on" : ""}" data-bk="${esc(id)}">${on ? "✓ 已预约" + (b.by ? " · " + esc(b.by) : "") : "☐ 未预约"}</button>`;
}
function nlistHTML(id){
  return notesFor(id).map(n => { const mine = sh.me && n.by === sh.me;
    return `<div class="nrow ${mine ? "mine" : ""}"><div class="nm"><b>${esc(n.by || "匿名")}</b><small>${fmtTs(n.ts)}</small>${mine ? `<button class="nedit" data-eid="${esc(n.id)}">编辑</button><button class="ndel" data-eid="${esc(n.id)}">删除</button>` : ""}</div><div class="nt2">${esc(n.text)}</div></div>`; }).join("");
}
function noteBox(id){

    <div class="nlist">${nlistHTML(id)}</div>
    <textarea class="pn" rows="2" maxlength="800" placeholder="写给自己和同行的人，大家都能看到…"></textarea>
    <div class="nbtns"><button class="btn solid nadd">发布</button><button class="btn ncancel" style="display:none">取消编辑</button></div></details>`;
}
function addrHTML(p){
  const a = ADDR[p.id]; if (!a) return "";
  return `<div class="addr3"><div class="ah">📍 地址 / Address / ที่อยู่</div><div>${esc(a[0])}</div><div class="en">${esc(a[1])}</div><div class="thx">${esc(a[2])}</div>
    <div class="btns"><button class="btn solid" data-drvi="${esc(p.id)}">给司机看 · ให้คนขับดู</button><button class="btn" data-cpth="${esc(p.id)}">复制泰文地址</button></div></div>`;
}
function findItem(id){ for (const d of DAYS){ const x = (d.items || []).find(q => q.id === id); if (x) return x; } return null; }
function showItemDriver(id){
  const a = ADDR[id], p = findItem(id); if (!a || !p) return;
  $("#overlayBox").innerHTML = `<div class="lbl">请带我去这里 · Please take me here · พาฉันไปที่นี่</div>
    <div class="big">${esc(p.th || p.ne || p.n)}</div><div class="addr">${esc(a[2])}</div>
    <div class="hint" style="margin-top:10px">${esc(a[1])}</div>
    <div class="hint" style="margin-top:6px">${esc(p.n)} · ${esc(a[0])}｜司机看不懂就点 Google 地图导航</div>`;
  $("#overlay").classList.add("show");
}
function copyText(txt, done){
  const fb = () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); done(ok); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), fb); else fb();
}
function setSyncStatus(){
  const el = $("#syncSt"); if (!el) return;
  el.textContent = sh.msg || "笔记/预约先存在本机；写完点「分享」发微信群，别人点「导入」";
}
function refreshShared(){
  const box = $("#itin"); if (!box) return;
  box.querySelectorAll("li[data-id]").forEach(li => {
    const id = li.dataset.id, bk = li.querySelector(".bk"), bh = bkHTML(id); if (bk && bk.innerHTML !== bh) bk.innerHTML = bh;
    const d = li.querySelector("details.nt");
    if (d){ const nl = d.querySelector(".nlist"), nh = nlistHTML(id); if (nl.innerHTML !== nh){ nl.innerHTML = nh; if (notesFor(id).length) d.open = true; } const c = notesFor(id).length; d.querySelector(".nc").textContent = c ? "· " + c + " 条" : ""; }
  });
  updateProgress(); renderFoot();
}
function syncNow(){}
function syncSoon(){}
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = t => { t = t.replace(/-/g,"+").replace(/_/g,"/"); while (t.length % 4) t += "="; return JSON.parse(decodeURIComponent(escape(atob(t)))); };
function myUpdates(){
  const o = {notes:{}, booked:{}}, me = sh.me;
  for (const k in sh.st.notes){ const n = sh.st.notes[k]; if (n.by === me) o.notes[k] = n; }
  for (const k in sh.st.booked){ const b = sh.st.booked[k]; if (b.by === me) o.booked[k] = b; }
  return o;
}
function cleanShared(x){
  const out = {notes:{}, booked:{}}, ok = v => typeof v === "string" && /^[A-Za-z0-9_-]{1,60}$/.test(v);
  if (!x || typeof x !== "object") return out;
  let c = 0;
  for (const k in (x.notes || {})){ const n = x.notes[k]; if (c++ > 500) break; if (!n || !ok(k) || !ok(n.item) || typeof n.ts !== "number") continue;
    out.notes[k] = {id:k, item:n.item, by:String(n.by || "").slice(0, 20), ts:n.ts, text:String(n.text || "").slice(0, 800)}; if (n.del) out.notes[k].del = true; }
  for (const k in (x.booked || {})){ const b = x.booked[k]; if (c++ > 900) break; if (!b || !ok(k) || typeof b.ts !== "number") continue;
    out.booked[k] = {v:!!b.v, by:String(b.by || "").slice(0, 20), ts:b.ts}; }
  return out;
}
function shareMine(){
  if (needName()) return;
  const u = myUpdates(), nn = Object.keys(u.notes).length, nb = Object.keys(u.booked).length;
  const panel = $("#sharePanel"), out = $("#shareOut"), msg = $("#shareMsg"); panel.style.display = "block";
  if (!nn && !nb){ out.value = ""; msg.textContent = "你还没有写过笔记，也没点过「已预约」，先去写一条再来分享。"; return; }
  const txt = "【南洋旅行】" + sh.me + " 的更新：" + nn + " 条笔记，" + nb + " 个预约状态\n（复制整段发到群里，别人打开网页点「导入」粘贴）\nNYTRIP1:" + b64e(u);
  out.value = txt; out.focus(); out.select();
  copyText(txt, ok => { msg.textContent = ok ? "已复制！去微信群粘贴发送。" : "没能自动复制：请长按上面的文字，全选后复制，发到微信群。"; });
}
function importShared(){
  const t = $("#impTxt").value, msg = $("#shareMsg"), ms = t.match(/NYTRIP1:[A-Za-z0-9_-]+/g);
  if (!ms){ msg.textContent = "没找到更新内容：请把微信里整段消息（含 NYTRIP1: 开头那串）完整粘贴进来。"; return; }
  let nn = 0, nb = 0, bad = 0;
  ms.forEach(m => { try {
    const inc = cleanShared(b64d(m.slice(8))), before = JSON.stringify(sh.st);
    const merged = mergeShared(sh.st, inc); if (JSON.stringify(merged) !== before){ nn += Object.keys(inc.notes).length; nb += Object.keys(inc.booked).length; sh.st = merged; }
  } catch(e){ bad++; } });
  saveShared(); refreshShared(); $("#impTxt").value = "";
  msg.textContent = bad ? "有 " + bad + " 段内容不完整，没能导入（可能被微信截断了）。" : "导入完成：新增/更新 " + nn + " 条笔记、" + nb + " 个预约状态。";
}
function needName(){ return false; }

  const i = $("#meName"); if (!i) return;
  i.onchange = () => { sh.me = i.value.trim(); store.set("me", sh.me); refreshShared(); setSyncStatus(); };
  $("#shareBtn").onclick = shareMine;
  $("#impBtn").onclick = () => { const p = $("#sharePanel"); p.style.display = "block"; $("#impTxt").focus(); };
  $("#impGo").onclick = importShared;

function dropSharedFor(id){
  const now = Date.now();
  Object.values(sh.st.notes).filter(n => n.item === id && !n.del).forEach(n => { sh.st.notes[n.id] = Object.assign({}, n, {del:true, text:"", ts:now}); });
  if (sh.st.booked[id]) sh.st.booked[id] = Object.assign({}, sh.st.booked[id], {v:false, ts:now});
  saveShared(); syncSoon();
}
function sharedClick(e){
  const t = e.target;
  const bk = t.closest(".bkb");
  if (bk){
    if (needName()) return true;
    const id = bk.dataset.bk; sh.st.booked[id] = {v:!bookedOn(id), by:sh.me, ts:Date.now()};
    saveShared(); refreshShared(); syncSoon(); return true;
  }
  const d = t.closest("[data-drvi]"); if (d){ showItemDriver(d.dataset.drvi); return true; }
  const c = t.closest("[data-cpth]");
  if (c){ const a = ADDR[c.dataset.cpth]; copyText(a ? a[2] : "", ok => { c.textContent = ok ? "已复制 ✓" : "复制失败，请长按选中"; }); return true; }
  const box = t.closest("details.nt"); if (!box) return false;
  const ta = box.querySelector("textarea.pn"), id = box.dataset.nid;
  if (t.closest(".nadd")){
    const txt = ta.value.trim(); if (!txt) return true;
    if (needName()) return true;
    const eid = ta.dataset.edit;
    if (eid && sh.st.notes[eid]) sh.st.notes[eid] = Object.assign({}, sh.st.notes[eid], {text:txt.slice(0, 800), ts:Date.now()});
    else { const nid = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); sh.st.notes[nid] = {id:nid, item:id, by:sh.me, ts:Date.now(), text:txt.slice(0, 800)}; }
    ta.value = ""; delete ta.dataset.edit; box.querySelector(".ncancel").style.display = "none"; box.querySelector(".nadd").textContent = "发布";
    saveShared(); refreshShared(); syncSoon(); return true;
  }
  if (t.closest(".ncancel")){ ta.value = ""; delete ta.dataset.edit; t.closest(".ncancel").style.display = "none"; box.querySelector(".nadd").textContent = "发布"; return true; }
  const ed = t.closest(".nedit");
  if (ed){ const n = sh.st.notes[ed.dataset.eid]; if (n){ ta.value = n.text; ta.dataset.edit = n.id; ta.focus(); box.querySelector(".ncancel").style.display = ""; box.querySelector(".nadd").textContent = "保存修改"; } return true; }
  const dl = t.closest(".ndel");
  if (dl){ const n = sh.st.notes[dl.dataset.eid]; if (n && confirm("删除这条笔记？")){ sh.st.notes[n.id] = Object.assign({}, n, {del:true, text:"", ts:Date.now()}); saveShared(); refreshShared(); syncSoon(); } return true; }
  return false;
}
function bindItin(day){
  const box = $("#itin");
  bindSyncBar();

    if (sharedClick(e)) return;
    const b = e.target.closest(".chk");
    if (b){
      const v = getVisit(), id = b.dataset.id;
      if (v[id]) delete v[id]; else v[id] = stampNow();
      store.set("visit", v);
      const li = b.closest("li"), on = !!v[id];
      b.classList.toggle("on", on); b.textContent = on ? "✓ 已打卡 · " + v[id] : "☐ 打卡";
      li.classList.toggle("visited", on);

      () => { $("#apLocT").textContent = "没拿到定位，不影响保存"; }, {timeout:10000});

    if (sel === "auto"){ if (t){ day.items.forEach(p => { if (p.t <= t) after = p.id; }); } }
    else if (sel !== "end") after = sel;

function renderFoot(){
